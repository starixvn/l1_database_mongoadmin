systemLog:
  verbosity: 0
  destination: file
  path: '/data/db/.log/mongod.log'
  timeStampFormat: iso8601-utc
net:
  port: 17104
security:
  keyFile: /run/secrets/keyFile
  javascriptEnabled: true
storage:
  dbPath: /data/db
  journal:
    enabled: true
  directoryPerDB: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
operationProfiling:
  slowOpThresholdMs: 100
  mode: slowOp
replication:
  oplogSizeMB: 128
